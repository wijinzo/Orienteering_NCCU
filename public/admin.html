<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#587492"><title>活動管理｜記憶之境</title><link rel="stylesheet" href="/admin.css"><script src="/config.js"></script><script type="module" src="/admin-app.js"></script></head>
<body>
<header class="topbar"><a class="brand" href="./"><img src="/assets/characters/National_Chengchi_University_logo.svg.webp" width="30" height="30" alt="政大校徽"><strong>記憶之境</strong><span>活動管理</span></a><button id="admin-logout" type="button" hidden>登出管理者</button></header>
<main id="admin-login" class="login-sheet"><p class="scope">活動人員專用</p><h1 id="admin-login-title" class="login-title">活動管理</h1><p>查看隊伍進度，協助現場繼續冒險。</p><form id="admin-login-form"><label for="admin-password">管理密碼</label><input id="admin-password" type="password" autocomplete="current-password" minlength="16" maxlength="200" required><button class="primary" id="admin-login-submit" type="submit">登入管理後台</button></form><div id="admin-login-wait" class="wait" role="status" hidden></div><p class="muted">管理登入與玩家身分分開；閒置切換分頁不會清除遊戲進度。</p></main>
<div id="admin-workspace" class="workspace" hidden>
<nav class="sidebar" aria-label="管理功能"><p class="scope" id="admin-activity"></p><button data-view="teams" aria-current="page">正式隊伍</button><button data-view="solo">個人模式</button><button data-view="logs">操作紀錄</button><p class="nav-note">前景每 15 秒更新。最近活動時間不等於在線狀態。</p></nav>
<main class="sheet"><div class="title-row"><div><h1 id="admin-title">隊伍總覽</h1><p id="admin-updated" class="muted">正在讀取活動資料…</p></div><button id="admin-refresh" type="button">更新資料</button></div>
<div id="admin-wait" class="wait" role="status" hidden></div><p id="admin-message" class="message" role="status" hidden></p><p id="admin-error" class="error" role="alert" hidden></p>
<section id="view-teams"><div id="admin-summary" class="summary-strip"></div><div class="overview-grid"><section aria-label="正式隊伍進度"><div class="list-heading"><h2>正式 1～10 組</h2><span class="muted">選擇隊伍查看與管理</span></div><div id="admin-team-list" class="team-list"></div></section><aside class="rail"><h2>等待中的隊伍</h2><div id="admin-waiting"></div><h2>最近操作</h2><div id="admin-recent"></div></aside></div></section>
<section id="view-solo" hidden><div class="list-heading"><h2>個人冒險</h2><span id="solo-total" class="muted"></span></div><p class="muted">個人進度獨立保存，不參與正式首通排名；此處僅供查看。</p><div id="admin-solo-list" class="team-list"></div><div class="pager"><button id="solo-prev">上一頁</button><button id="solo-next">下一頁</button></div></section>
<section id="view-logs" hidden><div class="list-heading"><h2>管理操作紀錄</h2><span id="logs-total" class="muted"></span></div><p class="muted">重設隊伍後仍保留紀錄；不包含玩家的私人留言與 AI 回信。</p><div id="admin-log-list"></div><div class="pager"><button id="logs-prev">上一頁</button><button id="logs-next">下一頁</button></div></section>
</main></div>
<dialog id="admin-detail" aria-labelledby="detail-title"><div class="dialog-heading"><h2 id="detail-title"></h2><button id="detail-close" type="button">關閉</button></div><div id="detail-content"></div><div id="detail-wait" class="wait" role="status" hidden></div><p id="detail-error" class="error" role="alert" hidden></p><button id="admin-retry" type="button" hidden>重試原操作</button></dialog>
<p id="admin-login-error" class="login-error error" role="alert" hidden></p>
</body></html>
