name: Deploy frontend to GitHub Pages
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - 'tools/build-pages.mjs'
      - 'package*.json'
      - '.github/workflows/pages.yml'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Check whether Pages has been enabled
        id: availability
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/pages" >/dev/null 2>&1 || [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Enable Settings > Pages > Source: GitHub Actions, then run this workflow manually."
          fi
      - uses: actions/setup-node@v4
        if: steps.availability.outputs.enabled == 'true'
        with:
          node-version: 24
          cache: npm
      - uses: actions/configure-pages@v5
        if: steps.availability.outputs.enabled == 'true'
        id: pages
      - name: Install build dependencies
        if: steps.availability.outputs.enabled == 'true'
        run: npm ci --omit=dev
      - name: Build frontend only
        if: steps.availability.outputs.enabled == 'true'
        env:
          API_BASE_URL: ${{ vars.RENDER_API_URL || 'https://orienteering-nccu.onrender.com' }}
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: node tools/build-pages.mjs
      - uses: actions/upload-pages-artifact@v4
        if: steps.availability.outputs.enabled == 'true'
        with:
          path: .pages-build
      - uses: actions/deploy-pages@v4
        if: steps.availability.outputs.enabled == 'true'
        id: deployment
