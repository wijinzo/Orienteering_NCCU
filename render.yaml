services:
  - type: web
    name: orienteering-nccu
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: ACTIVITY_ID
        value: nccu-2026
      - key: TOKEN_TTL_DAYS
        value: 7
      - key: TOKEN_SECRET
        generateValue: true
      - key: INVITE_CODE
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
